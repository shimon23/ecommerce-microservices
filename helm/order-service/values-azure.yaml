# Azure AKS production values for order-service

replicaCount: 2

image:
  repository: ecommercedevacr2hxvdq.azurecr.io/order-service
  pullPolicy: Always
  tag: "v1.0.0"

service:
  type: ClusterIP
  port: 8001

env:
  - name: PRODUCT_SERVICE_URL
    value: "http://product-service:8000"

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: false